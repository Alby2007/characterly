<!doctype html>
<!-- og.png source. Screenshot this file at exactly 1200×630 and save over
     public/og.png. Uses the repo's own assets (node_modules font, public/art),
     so it renders offline via file:// in a headless browser. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Archivo Variable";
    src: url("../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2") format("woff2");
    font-weight: 100 900;
    font-stretch: 62.5% 125%;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Archivo Variable", system-ui, sans-serif;
    background: #ebeefd;
    display: flex;
    align-items: flex-end;
  }
  .portrait {
    width: 430px;
    align-self: flex-end;
    display: block;
    margin-left: 40px;
  }
  .right {
    flex: 1;
    padding: 42px 40px 44px 30px;
    align-self: stretch;
    display: flex;
    flex-direction: column;
  }
  .wordmark { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .wordmark svg { width: 40px; height: 40px; }
  .wordmark span { font-size: 30px; font-weight: 750; font-stretch: 112%; color: #14183a; letter-spacing: -0.5px; }
  h1 {
    font-size: 62px;
    line-height: 1.0;
    font-weight: 800;
    font-stretch: 125%;
    letter-spacing: -0.02em;
    color: #14183a;
    margin-bottom: 18px;
    white-space: nowrap;
  }
  .sub {
    font-size: 24px;
    line-height: 1.3;
    color: #454d78;
    font-weight: 550;
    margin-bottom: 24px;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    border: 1px solid #d8ddf2;
    box-shadow: 0 18px 40px -24px rgba(20, 24, 58, 0.35);
    padding: 14px 20px 4px;
    width: 660px;
  }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .card-head b { font-size: 24px; font-weight: 800; font-stretch: 118%; color: #14183a; }
  .card-head i { font-style: normal; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: #5c638c; }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 0; border-top: 1px solid #e9ecfa;
    font-size: 18px; font-weight: 600; color: #14183a;
  }
  .chip {
    font-size: 12px; font-weight: 800; letter-spacing: 0.06em;
    padding: 5px 10px; border-radius: 7px; flex-shrink: 0;
  }
  .dm { background: #3450f0; color: #fff; }
  .srv { background: #cf1f5e; color: #fff; }
  .row .state { margin-left: auto; font-size: 15px; font-weight: 650; color: #5c638c; white-space: nowrap; }
  .row.dead span.txt { color: #5c638c; text-decoration: line-through; }
</style>
</head>
<body>
  <img class="portrait" src="../public/art/wren-archive-848.webp" alt="" />
  <div class="right">
    <div class="wordmark">
      <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#14183a"/><path d="M27.3 18.6A14 14 0 1 0 43 37.5A12 12 0 0 1 27.3 18.6Z" fill="#ffffff"/><path d="M43 13.5l1.5 5.2 5.2 1.5-5.2 1.5L43 26.9l-1.5-5.2-5.2-1.5 5.2-1.5z" fill="#ffb21e"/></svg>
      <span>Characterly</span>
    </div>
    <h1>They remember<br />you.</h1>
    <p class="sub">AI companions in your Discord DMs, and in every server you bring them to.</p>
    <div class="card">
      <div class="card-head"><b>Wren</b><i>HER ARCHIVE</i></div>
      <div class="row"><span class="chip dm">YOUR DMS</span><span class="txt">First 10k on Sunday. Ask how it went.</span><span class="state">&#9734; Pinned</span></div>
      <div class="row"><span class="chip srv">#BOOK-CLUB</span><span class="txt">Hates spoilers. Halfway through the finale.</span><span class="state"></span></div>
      <div class="row dead"><span class="chip dm">YOUR DMS</span><span class="txt">Her old flatmate's name.</span><span class="state">&times; Forgotten</span></div>
    </div>
  </div>
</body>
</html>
