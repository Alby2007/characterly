<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Characterly</title>
  <meta name="description" content="Sign in or create your Characterly account." />
  <meta name="theme-color" content="#07070f" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body class="auth-body">
  <div class="aurora" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="grain"></div>
  </div>

  <main class="auth-wrap">
    <a class="brand auth-brand" href="/">
      <img src="/favicon.svg" alt="" width="30" height="30" />
      <span>Characterly</span>
    </a>

    <div class="auth-card" id="auth-card">
      <h1 id="auth-title">Welcome</h1>
      <p class="auth-sub" id="auth-sub">Your account carries your companion's premium features.</p>

      <!-- Tab bar -->
      <div class="tab-bar" id="tab-bar" role="tablist" aria-label="Sign in options">
        <button class="tab active" role="tab" aria-selected="true" data-tab="signin">Sign in</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="signup">Create account</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="magic">Magic link</button>
      </div>

      <!-- Sign in -->
      <form id="form-signin" class="auth-form" novalidate>
        <label class="field">
          <span>Email</span>
          <input class="input" type="email" name="email" autocomplete="email" required />
        </label>
        <label class="field">
          <span>Password</span>
          <input class="input" type="password" name="password" autocomplete="current-password" required />
        </label>
        <button class="btn btn-primary btn-lg full" type="submit">Sign in</button>
        <button class="link-btn" type="button" id="forgot-link">Forgot your password?</button>
      </form>

      <!-- Create account -->
      <form id="form-signup" class="auth-form" hidden novalidate>
        <label class="field">
          <span>Display name</span>
          <input class="input" type="text" name="display_name" autocomplete="nickname" maxlength="48" />
        </label>
        <label class="field">
          <span>Email</span>
          <input class="input" type="email" name="email" autocomplete="email" required />
        </label>
        <label class="field">
          <span>Password</span>
          <input class="input" type="password" name="password" autocomplete="new-password" required minlength="8" />
        </label>
        <button class="btn btn-primary btn-lg full" type="submit">Create account</button>
        <p class="form-note">We'll email you a verification link before you can sign in.</p>
      </form>

      <!-- Magic link -->
      <form id="form-magic" class="auth-form" hidden novalidate>
        <label class="field">
          <span>Email</span>
          <input class="input" type="email" name="email" autocomplete="email" required />
        </label>
        <button class="btn btn-primary btn-lg full" type="submit">Email me a link</button>
        <p class="form-note">No password — we'll send a one-click sign-in link.</p>
      </form>

      <!-- Forgot password -->
      <form id="form-forgot" class="auth-form" hidden novalidate>
        <label class="field">
          <span>Email</span>
          <input class="input" type="email" name="email" autocomplete="email" required />
        </label>
        <button class="btn btn-primary btn-lg full" type="submit">Send reset link</button>
        <button class="link-btn" type="button" id="back-to-signin">Back to sign in</button>
      </form>

      <!-- New password (recovery mode) -->
      <form id="form-recovery" class="auth-form" hidden novalidate>
        <label class="field">
          <span>New password</span>
          <input class="input" type="password" name="password" autocomplete="new-password" required minlength="8" />
        </label>
        <button class="btn btn-primary btn-lg full" type="submit">Set new password</button>
      </form>

      <!-- "Check your email" notice -->
      <div class="auth-notice" id="auth-notice" hidden>
        <div class="notice-icon" aria-hidden="true">✉</div>
        <h2>Check your email</h2>
        <p id="notice-text">We sent you a link.</p>
        <div class="notice-actions">
          <button class="link-btn" type="button" id="notice-resend" hidden>Resend email</button>
          <button class="link-btn" type="button" id="notice-back">Back to sign in</button>
        </div>
      </div>

      <div class="form-error" id="form-error" role="alert" hidden></div>

      <div class="divider" id="oauth-divider" hidden><span>or</span></div>
      <button class="oauth-btn" id="btn-discord" type="button" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.009c.12.1.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.21 0 2.176 1.094 2.157 2.418 0 1.334-.956 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.21 0 2.176 1.094 2.157 2.418 0 1.334-.947 2.419-2.157 2.419z"/></svg>
        Continue with Discord
      </button>
    </div>

    <p class="auth-foot">New to the bot? <a data-link="discord" target="_blank" rel="noopener noreferrer">Join our Discord</a></p>
  </main>

  <script type="module" src="/src/account.js"></script>
</body>
</html>
