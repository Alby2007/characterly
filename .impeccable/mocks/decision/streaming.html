<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1440">
<title>Streaming Title Wall sketch</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1440px;height:900px;overflow:hidden;background:#101114;color:#f5f5f7;font-family:"Segoe UI",system-ui,sans-serif}
  nav{display:flex;gap:30px;align-items:center;padding:22px 56px;font-weight:600;font-size:15px}
