<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1440">
<title>Category standard sketch</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1440px;height:900px;overflow:hidden;background:#fff;color:#0f0f12;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  nav{display:flex;align-items:center;gap:28px;padding:20px 48px;border-bottom:1px solid #e4e4e7;font-size:15px}
  nav b{font-size:22px;margin-right:auto}
  .cta{background:#7c3aed;color:#fff;padding:10px 18px;border-radius:999px;font-weight:600}
  .hero{text-align:center;padding:64px 0 36px}
  .hero h1{font-size:64px;letter-spacing:-.03em;font-weight:800}
  .hero p{font-size:20px;color:#52525b;margin-top:14px}
  .search{margin:28px auto 0;width:620px;height:56px;border:1px solid #e4e4e7;border-radius:999px;display:flex;align-items:center;padding:0 22px;color:#a1a1aa;font-size:18px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;padding:20px 48px}
  .card{border:1px solid #e4e4e7;border-radius:16px;overflow:hidden}
  .card .img{height:200px;background:#f4f4f5}
  .card .t{padding:12px 14px;font-weight:700;font-size:17px}
  .card .d{padding:0 14px 14px;color:#71717a;font-size:14px}
</style></head><body>
<nav><b>Characterly</b><span>Shelf</span><span>Pricing</span><span>FAQ</span><span class="cta">Continue with Discord</span></nav>
<div class="hero"><h1>AI characters that remember you</h1><p>Adopt a character, bring your own, and chat with them in Discord.</p><div class="search">Search characters…</div></div>
<div class="grid">
  <div class="card"><div class="img"></div><div class="t">Nyx</div><div class="d">Dry wit, night owl</div></div>
  <div class="card"><div class="img"></div><div class="t">Wren</div><div class="d">Cozy fantasy bard</div></div>
  <div class="card"><div class="img"></div><div class="t">Kael</div><div class="d">Rival swordsman</div></div>
  <div class="card"><div class="img"></div><div class="t">Mira</div><div class="d">Study buddy</div></div>
  <div class="card"><div class="img"></div><div class="t">Juno</div><div class="d">Space courier</div></div>
</div>
</body></html>
