name: test

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs exist so secret rotation (PROD_* env provisioning below) can
  # be applied without waiting for a push.
  workflow_dispatch:

# Least privilege — no job needs more than read access to the repo contents.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image — plain postgres:16 lacks the vector extension and
        # migrations fail (CREATE EXTENSION vector) before the suite starts.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Known-vulnerable deps must fail the build, not ride a green suite into
      # prod — audit the installed tree, not just the lockfile.
      - run: npm audit --audit-level=high
      - run: npm run check
      # Prove the production artifact compiles — deploys run `node dist/index.js`.
      - run: npm run build
      # Migrations auto-apply via MemoryStore.create in the test harness.
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/asb_test

  # The website has its own package.json/lockfile: audit its installed tree,
  # run its security-regression tests (redirect/allowlist rules) and prove the
  # Astro build before a push can ship it.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm audit --audit-level=high
      - working-directory: web
        run: npm run check
      - working-directory: web
        run: npm test
      - working-directory: web
        run: npm run build

  # Red builds never reach the server — deploy only runs on green pushes to main.
  # `environment: production` lets the operator attach required reviewers in
  # repo settings so a push alone can't ship without approval.
  deploy:
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    environment: production
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      # Pinned to the v0.9.0 tag's commit — third-party actions referenced by
      # mutable tags are a supply-chain risk.
      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_KEY }}
      # Pinned host key instead of accept-new: a MITM on first contact can no
      # longer substitute their own key. ORACLE_HOST_KEY is the output of
      # `ssh-keyscan` against the deploy host — if it's unset the strict check
      # fails closed and the deploy cannot run. The host itself lives in
      # ORACLE_SSH_HOST (user@ip) so the prod address isn't committed to the
      # repo.
      - name: Trust the deployment host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.ORACLE_HOST_KEY }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      # `npm ci` between pull and restart is load-bearing: a merged PR that
      # adds a dependency would otherwise crash prod on restart with a missing
      # module. Full install (not --omit=dev) because `npm run build` needs
      # devDependencies (tsc) — `npm prune --omit=dev` strips them afterward so
      # prod runs on runtime deps only. `npm start` is `node dist/index.js`;
      # tsx stays a runtime dep for the ops:* scripts.
      # The deploy also provisions the Node RUNTIME floor (engines in
      # package.json is advisory only) — a vulnerable binary gets replaced
      # with the patch for its own LTS line before the rebuild. Checksum-
      # verified against nodejs.org's SHASUMS256.txt; EOL/odd lines move to
      # 22 LTS. Floors: 22.23.4 / 24.22.1 / 26.12.1 — see
      # docs/security-node-oct2026.md.
      # Managed env: each PROD_* repo secret, when set, overwrites its key in
      # ~/characterly/.env on every deploy; unset secrets leave the file
      # alone. Values travel over scp — never in the ssh command line or
      # step logs. Rotate a key = set the PROD_* secret + run the workflow.
      - name: Pull, install, build, and restart on Oracle
        env:
          P_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          P_GROQ_API_KEY: ${{ secrets.PROD_GROQ_API_KEY }}
          P_DISCORD_TOKEN: ${{ secrets.PROD_DISCORD_TOKEN }}
          P_AVATAR_UPLOAD_SECRET: ${{ secrets.PROD_AVATAR_UPLOAD_SECRET }}
        run: |
          umask 077
          : > provided.env
          [ -n "${P_DATABASE_URL:-}" ] && printf 'DATABASE_URL=%s\n' "$P_DATABASE_URL" >> provided.env
          [ -n "${P_GROQ_API_KEY:-}" ] && printf 'GROQ_API_KEY=%s\n' "$P_GROQ_API_KEY" >> provided.env
          [ -n "${P_DISCORD_TOKEN:-}" ] && printf 'DISCORD_TOKEN=%s\n' "$P_DISCORD_TOKEN" >> provided.env
          [ -n "${P_AVATAR_UPLOAD_SECRET:-}" ] && printf 'AVATAR_UPLOAD_SECRET=%s\n' "$P_AVATAR_UPLOAD_SECRET" >> provided.env
          if [ -s provided.env ]; then
            scp -o StrictHostKeyChecking=yes provided.env ${{ secrets.ORACLE_SSH_HOST }}:/tmp/provided.env
            echo "staged $(wc -l < provided.env | tr -d ' ') managed env keys"
          fi
          rm -f provided.env

          ssh -o StrictHostKeyChecking=yes ${{ secrets.ORACLE_SSH_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/characterly
          git pull --ff-only

          # Apply provisioned env keys — drop each named line, append the new
          # one (no sed quoting traps: values arrive in the file verbatim).
          if [ -f /tmp/provided.env ]; then
            touch .env
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              key="${line%%=*}"
              grep -v "^${key}=" .env > .env.next || true
              printf '%s\n' "$line" >> .env.next
              mv .env.next .env
            done < /tmp/provided.env
            rm -f /tmp/provided.env
            chmod 600 .env
            echo "applied managed env keys to ~/characterly/.env"
          fi

          # Patched iff: 22.23.4+ / 24.22.1+ / 26.12.1+ / anything newer.
          # EOL and odd lines (20.x, 23.x, 25.x) jump to the 22 LTS patch.
          CUR="$(node -v)"
          TARGET="$(node -e '
            const [M, m, p] = process.versions.node.split(".").map(Number);
            const ok =
              (M === 22 && (m > 23 || (m === 23 && p >= 4))) ||
              (M === 24 && (m > 22 || (m === 22 && p >= 1))) ||
              (M === 26 && (m > 12 || (m === 12 && p >= 1))) ||
              M > 26;
            console.log(ok ? "" : (M === 24 ? "24.22.1" : M === 26 ? "26.12.1" : "22.23.4"));
          ')"
          if [ -n "$TARGET" ]; then
            case "$(uname -m)" in
              x86_64) NA=x64 ;; aarch64) NA=arm64 ;; *) echo "unsupported arch" >&2; exit 1 ;;
            esac
            pkg="node-v$TARGET-linux-$NA"
            cd /tmp
            curl -fsSLO "https://nodejs.org/dist/v$TARGET/$pkg.tar.xz"
            curl -fsSLO "https://nodejs.org/dist/v$TARGET/SHASUMS256.txt"
            grep " $pkg.tar.xz\$" SHASUMS256.txt | sha256sum -c -
            sudo tar -xJf "$pkg.tar.xz" -C /usr/local --strip-components=1
            rm -f "$pkg.tar.xz" SHASUMS256.txt
            cd ~/characterly
            echo "Node upgraded: $CUR -> $(node -v)"
          else
            echo "Node $CUR already meets the security floor"
          fi

          npm ci
          npm run build
          npm prune --omit=dev
          sudo systemctl restart characterly
          REMOTE
